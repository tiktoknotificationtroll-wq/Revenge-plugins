name: Build and publish BadgeForge repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badgeforge-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build installable plugin ZIP
        run: ./gradlew --no-daemon packageAllPlugins

      - name: Generate repository index
        run: |
          mkdir -p public/pool
          cp build/dist/dev.nichegames.badgeforge@1.0.0.zip public/pool/
          bun run generate-index -- --dist public/pool --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/pool" --out public/index.json

      - name: Publish repository branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
